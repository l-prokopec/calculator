<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-label="Display">0</div>
        <div class="keys" role="group" aria-label="Calculator keys">
          <button class="btn btn--action" type="button" data-key="ac">AC</button>
          <button class="btn btn--op" type="button" data-key="divide">/</button>
          <button class="btn btn--op" type="button" data-key="multiply">*</button>
          <button class="btn btn--op" type="button" data-key="minus">-</button>
          <button class="btn" type="button" data-key="7">7</button>
          <button class="btn" type="button" data-key="8">8</button>
          <button class="btn" type="button" data-key="9">9</button>
          <button class="btn btn--op" type="button" data-key="plus">+</button>
          <button class="btn" type="button" data-key="4">4</button>
          <button class="btn" type="button" data-key="5">5</button>
          <button class="btn" type="button" data-key="6">6</button>
          <button class="btn btn--op" type="button" data-key="equal">=</button>
          <button class="btn" type="button" data-key="1">1</button>
          <button class="btn" type="button" data-key="2">2</button>
          <button class="btn" type="button" data-key="3">3</button>
          <button class="btn" type="button" data-key="comma">,</button>
          <button class="btn btn--wide" type="button" data-key="0">0</button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
